<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
		<link rel="icon" href="favicon.ico">
		<meta charset="utf-8" />
		<meta content="Presentinator Host Dashboard" property="og:title" />
		<meta content="See results of an understood crowd" property="og:description" />
		<meta content="https://monke.gay/presentinator/host/" property="og:url" />
		<meta content="https://monke.gay/presentinator/favicon.png" property="og:image" />
		<meta content="#c73e3e" data-react-helmet="true" name="theme-color" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        <title>Presentinator</title>
    </head>
    <body>
        <div id="mainContainer">
			<div id="mainContent">
				<label for="roomCode">Room Code:</label>
				<input type="text" id="roomCode" name="roomCode" size="10"/>
				<div id="minMaxRow">
					<label for="roomMax">Opinion Max:</label>
					<input type="number" id="roomMax" name="roomMax" size="3" value="100"/>
					<label for="roomMin">Min:</label>
					<input type="number" id="roomMin" name="roomMin" size="3" value="0"/>
				</div>
				<button id="join">Create</button>
				<div id="hostInfo">
					<div id="graphContainer">
						<canvas id="voteGraph" width="160" height="90"></canvas>
					</div>
					<div id="opinion"></div>
					<div id="engagement"></div>
					<div id="score"></div>
				</div>
			</div>
        </div>
		<div id="credits">
			<div>Created by Adam Schultzer (tell me problems at <a href="mailto:dev@monke.gay">dev@monke.gay</a>)</div>
        </div>
        <script src="dist/bundle.js"></script>
    </body>
</html>
